<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<div id="startScreen">
<input id="babyName" placeholder="Nombre">
<select id="babyGender">
<option value="boy">Niño</option>
<option value="girl">Niña</option>
</select>
<button onclick="startGame()">Empezar</button>
</div>

<div id="game" style="display:none">

<button onclick="playBaby()">Jugar</button>
<button onclick="hugBaby()">Abrazar</button>
<button onclick="rattle()">Sonajero</button>
<button onclick="pacifier()">Chupete</button>
<button onclick="walk()">Paseo</button>

<button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>
<button onclick="prepareFood()">Preparar papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<button onclick="bathWater()">Agua</button>
<button onclick="bathSoap()">Jabón</button>
<button onclick="bathRinse()">Aclarar</button>
<button onclick="bathDry()">Secar</button>

<button onclick="diaperChange()">Cambiar pañal</button>
<button onclick="dressBaby()">Vestir</button>

<button onclick="soothe()">Arrullar</button>
<button onclick="sleepBaby()">Dormir</button>

<button onclick="takeTemperature()">Tomar temperatura</button>
<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>
<button onclick="giveMedicine()">Jarabe</button>

<p id="status"></p>
<p id="age"></p>
<p id="hunger"></p>
<p id="sleep"></p>
<p id="comfort"></p>

</div>

<script>

// ===== VARIABLES =====
let startTime=Date.now();
let hunger=30, sleep=30, comfort=70, diaper=0;
let state="idle";
let activeSound=null;

// ===== MÉDICO =====
let doctorState="idle";
let babySick=false;
let temperature=36.5;
let medicineToday=0;
let lastMedicineDay=0;
let sickStartTime=0;

// ===== EDAD =====
function getAge(){
let elapsed = Date.now()-startTime;
let total = 60*24*60*60*1000;
return Math.min(3,(elapsed/total)*3);
}

// ===== AUDIO =====
function playSound(src){
let a=new Audio(src);
activeSound=a;
a.play().catch(()=>{});
a.onended=()=>activeSound=null;
}

// desbloqueo audio
document.addEventListener("click",()=>{new Audio().play().catch(()=>{});},{once:true});

// ===== START =====
function startGame(){

if(!localStorage.getItem("startTime")){
startTime=Date.now();
localStorage.setItem("startTime",startTime);
}else{
startTime=Number(localStorage.getItem("startTime"));
}

localStorage.setItem("lastTime",Date.now());

document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
}

// ===== CARGA =====
document.addEventListener("DOMContentLoaded",()=>{

let savedStart=Number(localStorage.getItem("startTime"));
let savedLast=Number(localStorage.getItem("lastTime"));

if(savedStart){
startTime=savedStart;
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
}

if(savedLast){
let sec=(Date.now()-savedLast)/1000;

hunger+=sec*0.01;
sleep+=sec*0.008;
diaper+=sec*0.01;
comfort-=sec*0.005;

if(hunger>80||sleep>80||diaper>80){
setTimeout(()=>playSound("cry.mp3"),1000);
}
}

});

// ===== UI =====
setInterval(()=>{
document.getElementById("age").innerText="Edad: "+getAge().toFixed(2)+" años";
document.getElementById("hunger").innerText="Hambre: "+hunger.toFixed(0);
document.getElementById("sleep").innerText="Sueño: "+sleep.toFixed(0);
document.getElementById("comfort").innerText="Confort: "+comfort.toFixed(0);
},1000);

// ===== NECESIDADES =====
setInterval(()=>{
hunger+=0.15;
sleep+=0.12;
diaper+=0.15;
comfort-=0.08;
},3000);

// ===== LLANTOS =====
setInterval(()=>{
if(state!=="idle") return;
if(activeSound) return;

if(hunger>85){playSound("cry_hunger.mp3");return;}
if(sleep>85){playSound("cry_sleep.mp3");return;}
if(diaper>80){playSound("cry_discomfort.mp3");return;}

if((hunger>60||sleep>60)&&Math.random()<0.3){
playSound("babble_and_cry.mp3");
}

},6000);

// ===== SONIDOS FELICES =====
setInterval(()=>{
if(state!=="idle") return;
if(activeSound) return;
if(hunger>70||sleep>70||diaper>70) return;

let s=["babble.mp3","laugh.mp3","aaah_aaah.mp3"];
playSound(s[Math.floor(Math.random()*s.length)]);

},20000);

// ===== INTERACCIONES =====
function playBaby(){playSound("laugh.mp3");comfort+=5;}
function hugBaby(){playSound("babble.mp3");comfort+=10;}
function rattle(){playSound("rattle.mp3");}
function pacifier(){playSound("pacifier.mp3");}
function walk(){playSound("outdoor.mp3");}

// ===== COMIDA =====
function prepareBottle(){playSound("bottle_prepare.mp3");}
function feedBottle(){hunger-=30;playSound("bottle_drink.mp3");}

function prepareFood(){
if(getAge()<0.5){
document.getElementById("status").innerText="Aún es pequeño";
return;
}
playSound("food_prepare.mp3");
}
function feedFood(){hunger-=25;playSound("food_eat.mp3");}

// ===== BAÑO =====
function bathWater(){playSound("bath_water.mp3");}
function bathSoap(){playSound("bath_soap.mp3");}
function bathRinse(){playSound("bath_water.mp3");}
function bathDry(){playSound("bath_dry.mp3");}

// ===== PAÑAL =====
function diaperChange(){
diaper=0;
comfort+=10;
playSound("diaper.mp3");
}

// ===== VESTIR =====
function dressBaby(){
comfort+=5;
playSound("dress.mp3");
}

// ===== SUEÑO =====
function soothe(){playSound("musicbox.mp3");}
function sleepBaby(){
state="sleeping";
let i=setInterval(()=>{
sleep-=2;
if(sleep<=10){clearInterval(i);state="idle";}
},2000);
}

// ===== ENFERMAR =====
setInterval(()=>{
if(!babySick && Math.random()<0.02){
babySick=true;
sickStartTime=Date.now();
temperature=37.5+Math.random()*1.5;
document.getElementById("status").innerText="El bebé está enfermo";
}
},60000);

// ===== FIEBRE =====
setInterval(()=>{
if(!babySick) return;
temperature+=0.05;
if(temperature>39.5) temperature=39.5;
if(temperature>38) comfort-=0.3;
},10000);

// ===== 🤧 TOS Y ESTORNUDOS (AÑADIDO) =====
setInterval(()=>{

if(!babySick) return;
if(state!=="idle") return;
if(activeSound) return;

let r=Math.random();

if(r<0.5){
playSound("cough.mp3");
}else{
playSound("sneeze.mp3");
}

document.getElementById("status").innerText="El bebé tose o estornuda";

},30000);

// ===== JARABE =====
function getDay(){return Math.floor(Date.now()/(1000*60*60*24));}

function giveMedicine(){

if(!babySick){
document.getElementById("status").innerText="No necesita jarabe";
return;
}

let today=getDay();

if(today!==lastMedicineDay){
medicineToday=0;
lastMedicineDay=today;
}

if(medicineToday>=3){
document.getElementById("status").innerText="Ya tomó suficiente hoy";
return;
}

medicineToday++;
temperature-=0.7;
if(temperature<36.5) temperature=36.5;

playSound("medicine_swallow.mp3");

document.getElementById("status").innerText=
"Jarabe dado ("+medicineToday+"/3)";
}

// ===== MÉDICO =====
function takeTemperature(){
playSound("thermometer.mp3");
setTimeout(()=>{
document.getElementById("status").innerText=
"Temperatura "+temperature.toFixed(1);
},8000);
}

function goDoctor(){
doctorState="waiting";
playSound("outdoor.mp3");

setTimeout(()=>playSound("doctor_1.mp3"),3000);
setTimeout(()=>{
doctorState="ready";
document.getElementById("status").innerText="Puedes entrar";
},10000);
}

function enterDoctor(){
if(doctorState!=="ready") return;

doctorState="inside";
playSound("doctor_2.mp3");

setTimeout(()=>{
playSound("doctor_3.mp3");

setTimeout(()=>{
playSound("thermometer.mp3");

setTimeout(()=>{
document.getElementById("status").innerText=
"Temperatura "+temperature.toFixed(1);
},8000);

},5000);

},4000);

setTimeout(()=>{
if(babySick){
playSound("doctor_4.mp3");
}else{
document.getElementById("status").innerText="No tiene fiebre";
}
},18000);
}

function exitDoctor(){
doctorState="idle";
playSound("outdoor.mp3");
}

// ===== CURACIÓN =====
setInterval(()=>{
if(!babySick) return;

let days=(Date.now()-sickStartTime)/(1000*60*60*24);

if(days>2 && medicineToday>0){
if(Math.random()<0.3){
babySick=false;
temperature=36.5;
document.getElementById("status").innerText="El bebé se ha curado";
}
}

},60000);

</script>

</body>
</html>
