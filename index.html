<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<div id="startScreen">
    <input id="babyName" placeholder="Nombre del bebé">
    <select id="babyGender">
        <option value="boy">Niño</option>
        <option value="girl">Niña</option>
    </select>
    <button onclick="startGame()">Empezar</button>
</div>

<div id="game" style="display:none">

<!-- INTERACCIONES -->
<button onclick="playBaby()">Jugar</button>
<button onclick="hugBaby()">Abrazar</button>
<button onclick="rattle()">Sonajero</button>
<button onclick="pacifier()">Chupete</button>
<button onclick="walk()">Paseo</button>

<!-- COMIDA -->
<button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>
<button onclick="prepareFood()">Preparar papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<!-- BAÑO -->
<button onclick="bathWater()">Agua</button>
<button onclick="bathSoap()">Jabón</button>
<button onclick="bathRinse()">Aclarar</button>
<button onclick="bathDry()">Secar</button>

<!-- CUIDADO -->
<button onclick="soothe()">Arrullar</button>
<button onclick="sleepBaby()">Dormir</button>

<!-- MÉDICO -->
<button onclick="takeTemperature()">Tomar temperatura</button>
<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>
<button onclick="giveMedicine()">Jarabe</button>

<p id="status"></p>
<p id="age"></p>
<p id="hunger"></p>
<p id="sleep"></p>
<p id="comfort"></p>

</div>

<script>

// ================= VARIABLES =================
let babyName="", babyGender="";
let startTime=Date.now();
let lastTime=Date.now();

let hunger=30, sleep=30, comfort=70;
let state="idle";
let activeSound=null;

// enfermedad
let babySick=false;
let temperature=36.5;
let medicineGiven=0;
let lastMedicineTime=0;
let sickStartTime=0;

// sonidos
let lastRandomSound=null;

// ================= EDAD =================
function getAge(){
    let elapsed = Date.now() - startTime;
    let total = 60*24*60*60*1000;
    return Math.min(3,(elapsed/total)*3);
}

// ================= AUDIO =================
function playSound(src){
    if(activeSound) return;
    let a=new Audio(src);
    activeSound=a;
    a.play();
    a.onended=()=>activeSound=null;
}

// ================= START =================
function startGame(){

    babyName = document.getElementById("babyName").value || "Bebé";
    babyGender = document.getElementById("babyGender").value;

    startTime = Date.now();

    localStorage.setItem("babyName", babyName);
    localStorage.setItem("babyGender", babyGender);
    localStorage.setItem("startTime", startTime);
    localStorage.setItem("lastTime", Date.now());

    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";

    document.getElementById("status").innerText = babyName + " ha nacido";
}

// ================= CARGA =================
document.addEventListener("DOMContentLoaded", ()=>{

    let savedName = localStorage.getItem("babyName");
    let savedGender = localStorage.getItem("babyGender");
    let savedStart = Number(localStorage.getItem("startTime"));
    let savedLast = Number(localStorage.getItem("lastTime"));

    if(savedName){
        babyName = savedName;
        babyGender = savedGender;
        startTime = savedStart;

        document.getElementById("startScreen").style.display="none";
        document.getElementById("game").style.display="block";

        document.getElementById("status").innerText =
        "Has vuelto con " + babyName;
    }

    // ⏳ SIMULAR TIEMPO PASADO
    if(savedLast){
        let diff = Date.now()-savedLast;
        let sec = diff/1000;

        hunger += sec*0.02;
        sleep += sec*0.015;
        comfort -= sec*0.01;

        hunger = Math.min(100,hunger);
        sleep = Math.min(100,sleep);
        comfort = Math.max(0,comfort);

        // 😭 LLANTO AL VOLVER
        if(hunger>80 || sleep>80 || comfort<20){
            setTimeout(()=>{
                if(!activeSound){
                    playSound("cry.mp3");
                }
            },1000);
        }
    }
});

// guardar tiempo
setInterval(()=>{
    localStorage.setItem("lastTime",Date.now());
},5000);

// ================= UI =================
setInterval(()=>{
    document.getElementById("age").innerText =
    "Edad: " + getAge().toFixed(2) + " años";

    document.getElementById("hunger").innerText =
    "Hambre: " + hunger.toFixed(0);

    document.getElementById("sleep").innerText =
    "Sueño: " + sleep.toFixed(0);

    document.getElementById("comfort").innerText =
    "Confort: " + comfort.toFixed(0);
},1000);

// ================= INTERACCIONES =================
function playBaby(){ playSound("laugh.mp3"); comfort+=5; }
function hugBaby(){ playSound("babble.mp3"); comfort+=10; }
function rattle(){ playSound("rattle.mp3"); }
function pacifier(){ playSound("pacifier.mp3"); }
function walk(){ playSound("outdoor.mp3"); }

// ================= COMIDA =================
function prepareBottle(){ playSound("bottle_prepare.mp3"); }
function feedBottle(){ hunger-=30; playSound("bottle_drink.mp3"); }

function prepareFood(){
    if(getAge()<0.5){
        document.getElementById("status").innerText="Aún es pequeño para papilla";
        return;
    }
    playSound("food_prepare.mp3");
}

function feedFood(){
    if(getAge()<0.5){
        document.getElementById("status").innerText="Aún no puede comer papilla";
        return;
    }
    hunger-=25;
    playSound("food_eat.mp3");
}

// ================= BAÑO =================
function bathWater(){ playSound("bath_water.mp3"); }
function bathSoap(){ playSound("bath_soap.mp3"); }
function bathRinse(){ playSound("bath_water.mp3"); }
function bathDry(){ playSound("bath_dry.mp3"); }

// ================= SUEÑO =================
function soothe(){ playSound("musicbox.mp3"); }

function sleepBaby(){

    if(Math.random()<0.5){
        playSound("cry.mp3");
        return;
    }

    state="sleeping";

    let breathing=setInterval(()=>{
        if(!activeSound){
            playSound("breathing.mp3");
        }
    },8000);

    let sleepInterval=setInterval(()=>{
        sleep-=2;
        if(sleep<=10){
            clearInterval(sleepInterval);
            clearInterval(breathing);
            state="idle";
        }
    },2000);
}

// ================= SONIDOS ALEATORIOS =================
let sounds=[
"babble.mp3","laugh.mp3","aaah_aaah.mp3",
"tatata.mp3","dada.mp3",
"popopo_ti_ta.mp3","mama_papa_tete.mp3"
];

function babyRandomSounds(){

    if(state!=="idle") return;

    let delay=15000+Math.random()*30000;

    setTimeout(()=>{

        if(!activeSound){

            if(hunger>85){ playSound("cry_hunger.mp3"); return; }
            if(sleep>85){ playSound("cry_sleep.mp3"); return; }
            if(comfort<15){ playSound("cry_discomfort.mp3"); return; }

            let s;
            do{
                s=sounds[Math.floor(Math.random()*sounds.length)];
            }while(s===lastRandomSound);

            lastRandomSound=s;
            playSound(s);
        }

        babyRandomSounds();

    },delay);
}

babyRandomSounds();

</script>

</body>
</html>
