<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<!-- INICIO -->
<div id="startScreen">
    <h2>Crear bebé</h2>
    <input id="babyName" placeholder="Nombre del bebé">
    <select id="babyGender">
        <option value="boy">Niño</option>
        <option value="girl">Niña</option>
    </select>
    <button onclick="startGame()">Empezar</button>
</div>

<!-- JUEGO -->
<div id="game" style="display:none">

<button onclick="playBaby()">Jugar</button>
<button onclick="hugBaby()">Abrazar</button>
<button onclick="rattle()">Sonajero</button>
<button onclick="pacifier()">Chupete</button>
<button onclick="walk()">Paseo</button>

<button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>

<button onclick="prepareFood()">Preparar papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<button onclick="bathWater()">Agua</button>
<button onclick="bathSoap()">Jabón</button>
<button onclick="bathRinse()">Aclarar</button>
<button onclick="bathDry()">Secar</button>

<button onclick="changeDiaper()">Pañal</button>
<button onclick="dress()">Vestir</button>

<button onclick="soothe()">Arrullar</button>
<button onclick="sleepBaby()">Dormir</button>

<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>

<button onclick="giveMedicine()">Jarabe</button>

<button onclick="readStatus()">Consultar estado</button>

<p id="status" aria-live="polite"></p>
<p id="age"></p>

<p id="hunger"></p>
<p id="sleep"></p>
<p id="comfort"></p>

</div>

<script>

// ================= VARIABLES =================
let babyName="";
let babyGender="";
let startTime=Date.now();

let hunger=30, sleep=30, comfort=70;
let diaperDirty=false;

let state="idle";
let activeSound=null;

// ================= TALKBACK =================
let lastSpeak=0;
let lastEvent="";

function announce(text,id){
    let now=Date.now();

    if(now-lastSpeak<30000) return;
    if(lastEvent===id) return;

    lastSpeak=now;
    lastEvent=id;

    document.getElementById("status").innerText=text;
}

// ================= AUDIO =================
function playSound(src){
    if(activeSound) return;
    let a=new Audio(src);
    activeSound=a;
    a.play();
    a.onended=()=>activeSound=null;
}

// ================= CARGA =================
document.addEventListener("DOMContentLoaded", ()=>{

    babyName = localStorage.getItem("babyName");
    babyGender = localStorage.getItem("babyGender");
    startTime = Number(localStorage.getItem("startTime"));

    if(babyName){
        document.getElementById("startScreen").style.display="none";
        document.getElementById("game").style.display="block";
        announce("Has vuelto con "+babyName,"load");
    }
});

// ================= START =================
function startGame(){

    babyName=document.getElementById("babyName").value||"Bebé";
    babyGender=document.getElementById("babyGender").value;
    startTime=Date.now();

    localStorage.setItem("babyName",babyName);
    localStorage.setItem("babyGender",babyGender);
    localStorage.setItem("startTime",startTime);

    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";

    announce(babyName+" ha nacido","start");
}

// ================= EDAD =================
function getAge(){
    return ((Date.now()-startTime)/86400000)/20;
}

setInterval(()=>{
    document.getElementById("age").innerText =
    "Edad: "+getAge().toFixed(2)+" años";
},1000);

// ================= ESTADO =================
setInterval(()=>{

    hunger+=0.2;
    sleep+=0.15;
    comfort-=0.1;

    hunger=Math.min(100,hunger);
    sleep=Math.min(100,sleep);
    comfort=Math.max(0,comfort);

    document.getElementById("hunger").innerText="Hambre: "+hunger.toFixed(0);
    document.getElementById("sleep").innerText="Sueño: "+sleep.toFixed(0);
    document.getElementById("comfort").innerText="Confort: "+comfort.toFixed(0);

    if(hunger>90) announce("El bebé tiene mucha hambre","hunger");
    if(sleep>90) announce("El bebé tiene muchísimo sueño","sleep");
    if(comfort<20) announce("El bebé está muy incómodo","comfort");

},3000);

// ================= CONSULTAR =================
function readStatus(){
    document.getElementById("status").innerText =
    "Estado del bebé. Hambre "+hunger.toFixed(0)+
    ", sueño "+sleep.toFixed(0)+
    ", confort "+comfort.toFixed(0);
}

// ================= PAÑAL =================
setInterval(()=>{
    if(state!=="idle") return;

    if(Math.random()<0.01){
        diaperDirty=true;
        comfort-=15;
        announce("El bebé ha ensuciado el pañal","diaper");
    }
},5000);

// ================= MIMOS =================
setInterval(()=>{
    if(state!=="idle") return;

    if(Math.random()<0.05){
        announce("El bebé quiere mimos","cuddle");
    }
},30000);

// ================= ACCIONES =================
function playBaby(){ playSound("laugh.mp3"); }
function hugBaby(){ playSound("babble.mp3"); }
function rattle(){ playSound("rattle.mp3"); }
function pacifier(){ playSound("pacifier.mp3"); }
function walk(){ playSound("outdoor.mp3"); }

function prepareBottle(){ playSound("bottle_prepare.mp3"); }
function feedBottle(){ hunger-=30; playSound("bottle_drink.mp3"); }

function prepareFood(){ playSound("food_prepare.mp3"); }
function feedFood(){
    hunger-=25;
    new Audio("spoon_in_bowl.mp3").play();
    new Audio("food_eat.mp3").play();
}

function bathWater(){ playSound("bath_water.mp3"); }
function bathSoap(){ playSound("bath_soap.mp3"); }
function bathRinse(){ playSound("bath_water.mp3"); }
function bathDry(){ playSound("bath_dry.mp3"); }

function changeDiaper(){
    diaperDirty=false;
    comfort+=25;
    playSound("diaper.mp3");
    announce("Pañal cambiado","clean");
}

function dress(){ playSound("clothes.mp3"); }

function soothe(){ playSound("musicbox.mp3"); }

function sleepBaby(){
    if(Math.random()<0.5){
        playSound("cry.mp3");
    }else{
        playSound("sleep.mp3");
    }
}

function goDoctor(){
    playSound("outdoor.mp3");
    setTimeout(()=>playSound("doctor_1.mp3"),3000);
    setTimeout(()=>playSound("doctor_2.mp3"),20000);
}

function enterDoctor(){
    playSound("doctor_3.mp3");

    setTimeout(()=>{
        new Audio("thermometer.mp3").play();

        setTimeout(()=>{
            let t=(36+Math.random()*2).toFixed(1);
            announce("Temperatura "+t+" grados","temp");
        },10000);

    },5000);

    setTimeout(()=>playSound("doctor_4.mp3"),25000);
}

function exitDoctor(){ playSound("outdoor.mp3"); }
function giveMedicine(){ playSound("medicine_swallow.mp3"); }

// ================= SONIDOS PASIVOS =================
setInterval(()=>{
    if(state!=="idle") return;
    if(activeSound) return;

    if(Math.random()<0.05){
        Math.random()<0.5
        ? playSound("babble.mp3")
        : playSound("laugh.mp3");
    }
},30000);

</script>

</body>
</html>
