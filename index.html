<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<div id="startScreen">
<input id="babyName" placeholder="Nombre del bebé">
<select id="babyGender">
<option>Niño</option>
<option>Niña</option>
</select>
<button onclick="startGame()">Empezar</button>
</div>

<div id="game" style="display:none">

<button onclick="playBaby()">Jugar</button>
<button onclick="hugBaby()">Abrazar</button>
<button onclick="rattle()">Sonajero</button>
<button onclick="pacifier()">Chupete</button>
<button onclick="walk()">Paseo</button>

<button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>
<button onclick="prepareFood()">Preparar papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<button onclick="bath()">Baño</button>
<button onclick="diaperChange()">Cambiar pañal</button>
<button onclick="dressBaby()">Vestir</button>

<button onclick="soothe()">Arrullar</button>
<button onclick="sleepBaby()">Dormir</button>

<button onclick="takeTemperature()">Tomar temperatura</button>
<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>
<button onclick="giveMedicine()">Jarabe</button>

<p id="status"></p>
<p id="age"></p>

</div>

<script>

// ===== VARIABLES =====
let babyName="Bebé";
let startTime=Date.now();

let hunger=30, sleep=30, comfort=70, diaper=0;
let state="idle";
let activeSound=null;

let babySick=false;
let temperature=36.5;
let medicineToday=0;
let lastMedicineDay=0;
let sickStartTime=0;

let doctorReady=false;

// ===== AUDIO CONTROL =====
function playSound(src, callback){
if(activeSound) return;

let a=new Audio(src);
activeSound=a;
a.play().catch(()=>{});

a.onended=()=>{
activeSound=null;
if(callback) callback();
};
}

// desbloqueo audio móvil
document.addEventListener("click",()=>{new Audio().play().catch(()=>{});},{once:true});

// ===== EDAD =====
function getAge(){
let elapsed=Date.now()-startTime;
let total=60*24*60*60*1000;
return Math.min(3,(elapsed/total)*3);
}

function getAgeText(){
let a=getAge();
let y=Math.floor(a);
let m=Math.floor((a-y)*12);

if(y===0) return m+" meses";
if(m===0) return y+" años";
return y+" años y "+m+" meses";
}

// ===== START =====
function startGame(){
babyName=document.getElementById("babyName").value || "Bebé";
startTime=Date.now();

document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
}

// ===== UI =====
setInterval(()=>{
document.getElementById("age").innerText="Edad: "+getAgeText();
},1000);

// ===== NECESIDADES =====
setInterval(()=>{
hunger+=0.1;
sleep+=0.1;
diaper+=0.15;
comfort-=0.05;

if(diaper>80){
document.getElementById("status").innerText=babyName+" ha ensuciado el pañal";
}

},4000);

// ===== LLANTO =====
setInterval(()=>{
if(state!=="idle" || activeSound) return;

if(hunger>85){ playSound("cry_hunger.mp3"); return;}
if(sleep>85){ playSound("cry_sleep.mp3"); return;}
if(diaper>85){ playSound("cry_discomfort.mp3"); return;}

if((hunger>60||sleep>60)&&Math.random()<0.3){
playSound("babble_and_cry.mp3");
}

},7000);

// ===== BALBUCEOS =====
setInterval(()=>{
if(state!=="idle" || activeSound) return;
if(hunger>70||sleep>70||diaper>70) return;

let sounds=["babble.mp3","aaah_aaah.mp3","tatata.mp3","dada.mp3","mama_papa_tete.mp3"];
playSound(sounds[Math.floor(Math.random()*sounds.length)]);

},25000);

// ===== ENFERMEDAD =====
setInterval(()=>{
if(!babySick && Math.random()<0.02){
babySick=true;
sickStartTime=Date.now();
temperature=37.5+Math.random();
document.getElementById("status").innerText=babyName+" está enfermo";
}
},60000);

// ===== FIEBRE =====
setInterval(()=>{
if(!babySick) return;
temperature+=0.05;
if(temperature>38) comfort-=0.2;
},10000);

// ===== TOS =====
setInterval(()=>{
if(!babySick || state!=="idle" || activeSound) return;

playSound(Math.random()<0.5?"cough.mp3":"sneeze.mp3");
document.getElementById("status").innerText=babyName+" tose o estornuda";

},30000);

// ===== ACCIONES =====
function playBaby(){ playSound("laugh.mp3"); }
function hugBaby(){ playSound("babble.mp3"); }
function rattle(){ playSound("rattle.mp3"); }
function pacifier(){ playSound("pacifier.mp3"); }
function walk(){ playSound("outdoor.mp3"); }

function prepareBottle(){ playSound("bottle_prepare.mp3"); }
function feedBottle(){ hunger-=30; playSound("bottle_drink.mp3"); }

function prepareFood(){
if(getAge()<0.5){
document.getElementById("status").innerText="Demasiado pequeño";
return;
}
playSound("food_prepare.mp3");
}
function feedFood(){ hunger-=25; playSound("food_eat.mp3"); }

function bath(){ playSound("bath_water.mp3"); }

function diaperChange(){ diaper=0; playSound("diaper.mp3"); }
function dressBaby(){ playSound("dress.mp3"); }

function soothe(){ playSound("musicbox.mp3"); }

// ===== SUEÑO =====
function sleepBaby(){
state="sleeping";
playSound("breathing.mp3");
setTimeout(()=>{state="idle";},20000);
}

// ===== TERMÓMETRO =====
function takeTemperature(){
playSound("thermometer.mp3",()=>{
setTimeout(()=>{
document.getElementById("status").innerText="Temperatura "+temperature.toFixed(1);
},2000);
});
}

// ===== MÉDICO =====
function goDoctor(){

playSound("outdoor.mp3",()=>{
setTimeout(()=>{
playSound("doctor_1.mp3",()=>{
setTimeout(()=>{
playSound("doctor_2.mp3");
doctorReady=true;
},6000);
});
},2000);
});

}

function enterDoctor(){

if(!doctorReady) return;

playSound("doctor_3.mp3",()=>{
setTimeout(()=>{
playSound("thermometer.mp3",()=>{
setTimeout(()=>{
document.getElementById("status").innerText="Temperatura "+temperature.toFixed(1);
setTimeout(()=>{
playSound("doctor_4.mp3");
},3000);
},3000);
});
},3000);
});

}

function exitDoctor(){
doctorReady=false;
playSound("outdoor.mp3");
}

// ===== JARABE =====
function getDay(){return Math.floor(Date.now()/(1000*60*60*24));}

function giveMedicine(){

if(!babySick){
document.getElementById("status").innerText="No necesita jarabe";
return;
}

let today=getDay();

if(today!==lastMedicineDay){
medicineToday=0;
lastMedicineDay=today;
}

if(medicineToday>=3){
document.getElementById("status").innerText="Ya tomó suficiente hoy";
return;
}

medicineToday++;
temperature-=0.7;

playSound("medicine_swallow.mp3");

}

// ===== CURACIÓN =====
setInterval(()=>{
if(!babySick) return;

let days=(Date.now()-sickStartTime)/(1000*60*60*24);

if(days>2 && medicineToday>0){
if(Math.random()<0.3){
babySick=false;
temperature=36.5;
document.getElementById("status").innerText=babyName+" se ha curado";
}
}
},60000);

</script>

</body>
</html>
