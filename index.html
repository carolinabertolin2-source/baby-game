<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<!-- INICIO -->
<div id="startScreen">
    <h2>Crear bebé</h2>
    <input id="babyName" placeholder="Nombre del bebé">
    <select id="babyGender">
        <option value="boy">Niño</option>
        <option value="girl">Niña</option>
    </select>
    <button onclick="startGame()">Empezar</button>
</div>

<div id="game" style="display:none">

<!-- ACCIONES -->
<button onclick="playBaby()">Jugar</button>
<button onclick="hugBaby()">Abrazar</button>
<button onclick="rattle()">Sonajero</button>
<button onclick="pacifier()">Chupete</button>
<button onclick="walk()">Paseo</button>

<!-- ALIMENTACIÓN -->
<button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>

<button onclick="prepareFood()">Preparar papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<!-- BAÑO -->
<button onclick="bathWater()">Agua</button>
<button onclick="bathSoap()">Jabón</button>
<button onclick="bathRinse()">Aclarar</button>
<button onclick="bathDry()">Secar</button>

<!-- CUIDADOS -->
<button onclick="changeDiaper()">Pañal</button>
<button onclick="dress()">Vestir</button>

<!-- SUEÑO -->
<button onclick="soothe()">Arrullar</button>
<button onclick="sleepBaby()">Dormir</button>

<!-- MÉDICO -->
<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>

<!-- SALUD -->
<button onclick="takeTemperature()">Tomar fiebre</button>
<button onclick="giveMedicine()">Jarabe</button>

<p id="status"></p>
<p id="age"></p>

</div>

<script>

// ================= ESTADO =================
let state = "idle";
let activeSound = null;

let babyName = "";
let babyGender = "";
let startTime = Date.now();

let sick = false;
let temperature = 36.5;

// ================= CARGA PERSISTENTE =================
babyName = localStorage.getItem("babyName") || "";
babyGender = localStorage.getItem("babyGender") || "";
startTime = Number(localStorage.getItem("startTime")) || Date.now();

// ================= AUDIO =================
function playSound(src, force=false){
    if(!force && state !== "idle") return;
    if(activeSound) return;

    let audio = new Audio(src);
    activeSound = audio;

    audio.play();
    audio.onended = ()=> activeSound = null;
}

// ================= INICIO =================
function startGame(){

    babyName = document.getElementById("babyName").value || "Bebé";
    babyGender = document.getElementById("babyGender").value;

    startTime = Date.now();

    localStorage.setItem("babyName", babyName);
    localStorage.setItem("babyGender", babyGender);
    localStorage.setItem("startTime", startTime);

    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";

    document.getElementById("status").innerText =
    babyName + " ha nacido";
}

// ================= EDAD =================
function getAgeYears(){
    let days = (Date.now()-startTime)/86400000;
    return days/20; // 60 días = 3 años
}

// mostrar edad en pantalla
setInterval(()=>{
    let age = getAgeYears();
    document.getElementById("age").innerText =
    "Edad: " + age.toFixed(2) + " años";
}, 1000);

// ================= ALIMENTACIÓN =================
function isFoodUnlocked(){
    return getAgeYears() >= 0.5;
}

// ================= JUGAR =================
function playBaby(){
    state="play";
    playSound("laugh.mp3", true);
    setTimeout(()=>state="idle",3000);
}

// ================= ABRAZAR =================
function hugBaby(){
    state="comfort";
    playSound("babble.mp3", true);
    setTimeout(()=>state="idle",3000);
}

// ================= SONAJERO =================
function rattle(){
    state="play";
    playSound("rattle.mp3", true);
    setTimeout(()=>state="idle",3000);
}

// ================= CHUPETE =================
function pacifier(){
    state="action";
    playSound("pacifier.mp3", true);
    setTimeout(()=>state="idle",3000);
}

// ================= PASEO =================
function walk(){
    state="action";
    playSound("outdoor.mp3", true);
    setTimeout(()=>state="idle",4000);
}

// ================= BIBERÓN =================
function prepareBottle(){
    state="feeding";
    playSound("bottle_prepare.mp3", true);
}

function feedBottle(){
    state="feeding";
    playSound("bottle_drink.mp3", true);
    setTimeout(()=>state="idle",3000);
}

// ================= PAPILLA =================
function prepareFood(){
    if(!isFoodUnlocked()){
        document.getElementById("status").innerText="Aún no puede tomar papilla";
        return;
    }
    playSound("food_prepare.mp3", true);
}

function feedFood(){
    if(!isFoodUnlocked()) return;

    state="feeding";

    new Audio("spoon_in_bowl.mp3").play();
    new Audio("food_eat.mp3").play();

    setTimeout(()=>state="idle",4000);
}

// ================= BAÑO =================
function bathWater(){ state="bath"; playSound("bath_water.mp3", true); }
function bathSoap(){ state="bath"; playSound("bath_soap.mp3", true); }
function bathRinse(){ state="bath"; playSound("bath_water.mp3", true); }

function bathDry(){
    state="bath";
    playSound("bath_dry.mp3", true);
    setTimeout(()=>state="idle",3000);
}

// ================= CUIDADOS =================
function changeDiaper(){ playSound("diaper.mp3", true); }
function dress(){ playSound("clothes.mp3", true); }

// ================= SUEÑO =================
function soothe(){
    state="sleep";
    playSound("musicbox.mp3", true);
}

function sleepBaby(){
    if(Math.random()<0.5){
        state="cry";
        playSound("cry.mp3", true);
    } else {
        state="sleep";
        playSound("sleep.mp3", true);
    }
}

// ================= MÉDICO =================
function goDoctor(){
    state="doctor";
    playSound("outdoor.mp3", true);

    setTimeout(()=>playSound("doctor_1.mp3", true),3000);
    setTimeout(()=>playSound("doctor_2.mp3", true),20000);
}

function enterDoctor(){
    playSound("doctor_3.mp3", true);

    setTimeout(()=>{
        new Audio("thermometer.mp3").play();

        setTimeout(()=>{
            let t = (36 + Math.random()*2).toFixed(1);
            document.getElementById("status").innerText =
            babyName + " tiene " + t + "°C";
        },10000);

    },5000);

    setTimeout(()=>playSound("doctor_4.mp3", true),25000);
}

function exitDoctor(){
    playSound("outdoor.mp3", true);
    state="idle";
}

// ================= JARABE =================
function giveMedicine(){
    playSound("medicine_swallow.mp3", true);
}

// ================= SONIDOS PASIVOS =================
setInterval(()=>{
    if(state==="idle" && !activeSound){
        if(Math.random()<0.5){
            playSound("babble.mp3");
        }else{
            playSound("laugh.mp3");
        }
    }
},15000);

// ================= ENFERMEDAD =================
setInterval(()=>{
    if(sick && state==="idle" && !activeSound){
        if(Math.random()<0.5){
            playSound("cough.mp3");
        }else{
            playSound("sneeze.mp3");
        }
    }
},20000);

</script>

</body>
</html>
