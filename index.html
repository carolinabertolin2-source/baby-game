<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<div id="startScreen">
    <h2>Crear bebé</h2>
    <input id="babyName" placeholder="Nombre del bebé">
    <select id="babyGender">
        <option value="boy">Niño</option>
        <option value="girl">Niña</option>
    </select>
    <button onclick="startGame()">Empezar</button>
</div>

<div id="game" style="display:none">

<button onclick="playBaby()">Jugar</button>
<button onclick="hugBaby()">Abrazar</button>
<button onclick="rattle()">Sonajero</button>
<button onclick="pacifier()">Chupete</button>
<button onclick="walk()">Paseo</button>

<button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>

<button onclick="prepareFood()">Papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<button onclick="bathWater()">Agua</button>
<button onclick="bathSoap()">Jabón</button>
<button onclick="bathRinse()">Aclarar</button>
<button onclick="bathDry()">Secar</button>

<button onclick="changeDiaper()">Pañal</button>
<button onclick="dress()">Vestir</button>

<button onclick="soothe()">Arrullar</button>
<button onclick="sleepBaby()">Dormir</button>

<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>

<button onclick="giveMedicine()">Jarabe</button>

<button onclick="readStatus()">Consultar estado</button>

<p id="status"></p>
<p id="age"></p>

<p id="hunger" aria-live="polite"></p>
<p id="sleep" aria-live="polite"></p>
<p id="comfort" aria-live="polite"></p>

</div>

<script>

// ================= VARIABLES =================
let babyName="";
let babyGender="";
let startTime=Date.now();

let hunger=30, sleep=30, comfort=70;
let diaperDirty=false;

let lastSpeak=0;
let lastEvent="";

// ================= TALKBACK =================
function announce(text,id){
    let now=Date.now();
    if(now-lastSpeak<20000) return;
    if(lastEvent===id) return;

    lastSpeak=now;
    lastEvent=id;

    document.getElementById("status").innerText=text;
}

// ================= INICIO =================
document.addEventListener("DOMContentLoaded", ()=>{

    babyName = localStorage.getItem("babyName");
    babyGender = localStorage.getItem("babyGender");
    startTime = Number(localStorage.getItem("startTime"));

    if(babyName){

        document.getElementById("startScreen").style.display="none";
        document.getElementById("game").style.display="block";

        announce("Has vuelto con "+babyName,"load");

    }

});

// ================= START =================
function startGame(){

    babyName=document.getElementById("babyName").value||"Bebé";
    babyGender=document.getElementById("babyGender").value;
    startTime=Date.now();

    localStorage.setItem("babyName",babyName);
    localStorage.setItem("babyGender",babyGender);
    localStorage.setItem("startTime",startTime);

    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";

    announce(babyName+" ha nacido","start");
}

// ================= EDAD =================
function getAge(){
    return ((Date.now()-startTime)/86400000)/20;
}

setInterval(()=>{
    document.getElementById("age").innerText=
    "Edad: "+getAge().toFixed(2)+" años";
},1000);

// ================= ESTADO =================
setInterval(()=>{

    hunger+=0.2;
    sleep+=0.15;
    comfort-=0.1;

    hunger=Math.min(100,hunger);
    sleep=Math.min(100,sleep);
    comfort=Math.max(0,comfort);

    document.getElementById("hunger").innerText="Hambre: "+hunger.toFixed(0);
    document.getElementById("sleep").innerText="Sueño: "+sleep.toFixed(0);
    document.getElementById("comfort").innerText="Confort: "+comfort.toFixed(0);

    if(hunger>80) announce("Tiene mucha hambre","hunger");
    if(sleep>80) announce("Tiene mucho sueño","sleep");
    if(comfort<30) announce("Está incómodo","comfort");

},3000);

// ================= LECTURA =================
function readStatus(){
    announce(
        "Estado: hambre "+hunger.toFixed(0)+
        ", sueño "+sleep.toFixed(0)+
        ", confort "+comfort.toFixed(0),
        "status"
    );
}

// ================= PAÑAL =================
setInterval(()=>{
    if(Math.random()<0.01){
        diaperDirty=true;
        comfort-=15;
        announce("Ha ensuciado el pañal","diaper");
    }
},5000);

// ================= ACCIONES =================
function playBaby(){ new Audio("laugh.mp3").play(); }
function hugBaby(){ new Audio("babble.mp3").play(); }
function rattle(){ new Audio("rattle.mp3").play(); }
function pacifier(){ new Audio("pacifier.mp3").play(); }
function walk(){ new Audio("outdoor.mp3").play(); }

function prepareBottle(){ new Audio("bottle_prepare.mp3").play(); }
function feedBottle(){ hunger-=30; new Audio("bottle_drink.mp3").play(); }

function prepareFood(){ new Audio("food_prepare.mp3").play(); }
function feedFood(){
    hunger-=25;
    new Audio("spoon_in_bowl.mp3").play();
    new Audio("food_eat.mp3").play();
}

function bathWater(){ new Audio("bath_water.mp3").play(); }
function bathSoap(){ new Audio("bath_soap.mp3").play(); }
function bathRinse(){ new Audio("bath_water.mp3").play(); }
function bathDry(){ new Audio("bath_dry.mp3").play(); }

function changeDiaper(){
    diaperDirty=false;
    comfort+=25;
    new Audio("diaper.mp3").play();
    announce("Pañal cambiado","clean");
}

function dress(){ new Audio("clothes.mp3").play(); }

function soothe(){ new Audio("musicbox.mp3").play(); }

function sleepBaby(){
    if(Math.random()<0.5){
        new Audio("cry.mp3").play();
    }else{
        new Audio("sleep.mp3").play();
    }
}

function goDoctor(){
    new Audio("outdoor.mp3").play();
    setTimeout(()=>new Audio("doctor_1.mp3").play(),3000);
    setTimeout(()=>new Audio("doctor_2.mp3").play(),20000);
}

function enterDoctor(){
    new Audio("doctor_3.mp3").play();
    setTimeout(()=>{
        new Audio("thermometer.mp3").play();
        setTimeout(()=>{
            let t=(36+Math.random()*2).toFixed(1);
            announce("Temperatura "+t+" grados","temp");
        },10000);
    },5000);
}

function exitDoctor(){ new Audio("outdoor.mp3").play(); }
function giveMedicine(){ new Audio("medicine_swallow.mp3").play(); }

// ================= PASIVOS =================
setInterval(()=>{
    if(Math.random()<0.05){
        Math.random()<0.5
        ? new Audio("babble.mp3").play()
        : new Audio("laugh.mp3").play();
    }
},30000);

</script>

</body>
</html>
