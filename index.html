<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<div id="startScreen">
    <h2>Crear bebé</h2>
    <input id="babyName" placeholder="Nombre del bebé">
    <button onclick="startGame()">Empezar</button>
</div>

<div id="game" style="display:none">

<button onclick="sleepBaby()">Dormir</button>
<button onclick="takeTemperature()">Tomar temperatura</button>
<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>
<button onclick="giveMedicine()">Jarabe</button>

<p id="status" aria-live="polite"></p>
<p id="age"></p>

</div>

<script>

// ================= VARIABLES =================
let babyName="";
let startTime=Date.now();
let lastTime=Date.now();

let hunger=30, sleep=30, comfort=70;
let state="idle";
let activeSound=null;

// enfermedad
let babySick=false;
let temperature=36.5;
let medicineGiven=0;
let lastMedicineTime=0;
let sickStartTime=0;

// sonidos
let lastRandomSound=null;
let learnedCounting=false;

// médico
let doctorState="idle";

// ================= EDAD =================
function getAge(){
    let elapsed = Date.now() - startTime;
    let total = 60*24*60*60*1000;
    let progress = elapsed/total;
    return Math.min(3,progress*3);
}

// ================= AUDIO =================
function playSound(src){
    if(activeSound) return;
    let a=new Audio(src);
    activeSound=a;
    a.play();
    a.onended=()=>activeSound=null;
}

// ================= TALKBACK =================
function announce(t){
    document.getElementById("status").innerText=t;
}

// ================= START =================
function startGame(){
    babyName=document.getElementById("babyName").value||"Bebé";
    startTime=Date.now();

    localStorage.setItem("startTime",startTime);
    localStorage.setItem("lastTime",Date.now());

    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";
}

// ================= TIEMPO OFFLINE =================
document.addEventListener("DOMContentLoaded", ()=>{

    let savedStart = Number(localStorage.getItem("startTime"));
    let savedLast = Number(localStorage.getItem("lastTime"));

    if(savedStart){
        startTime=savedStart;
        document.getElementById("startScreen").style.display="none";
        document.getElementById("game").style.display="block";
    }

    if(savedLast){
        let diff = Date.now()-savedLast;
        let sec = diff/1000;

        hunger+=sec*0.01;
        sleep+=sec*0.008;
        comfort-=sec*0.005;
    }
});

// guardar tiempo
setInterval(()=>{
    localStorage.setItem("lastTime",Date.now());
},5000);

// ================= SUEÑO =================
function sleepBaby(){

    if(Math.random()<0.5){
        playSound("cry.mp3");
        return;
    }

    state="sleeping";

    let breathing=setInterval(()=>{
        if(!activeSound){
            playSound("breathing.mp3");
        }
    },8000);

    let sleepInterval=setInterval(()=>{

        sleep-=2;
        comfort+=1;

        if(sleep<=10){
            clearInterval(sleepInterval);
            clearInterval(breathing);
            state="idle";
            announce("El bebé ha descansado");
        }

    },2000);
}

// ================= ENFERMEDAD =================
setInterval(()=>{

    if(!babySick && Math.random()<0.01){
        babySick=true;
        sickStartTime=Date.now();
        announce("El bebé parece enfermo");
    }

    if(babySick && !activeSound && state==="idle"){
        if(Math.random()<0.4){
            playSound("cough.mp3");
        }else if(Math.random()<0.4){
            playSound("sneeze.mp3");
        }
    }

},15000);

// fiebre dinámica
setInterval(()=>{
    if(babySick){
        temperature += (Math.random()-0.5)*0.2;
        temperature=Math.max(37,Math.min(39,temperature));
        comfort-=0.2;
    }
},10000);

// ================= TERMÓMETRO =================
function takeTemperature(){

    playSound("thermometer.mp3");

    setTimeout(()=>{
        announce("Temperatura "+temperature.toFixed(1)+" grados");
    },10000);
}

// ================= MEDICINA =================
function giveMedicine(){

    let now=Date.now();

    if(now-lastMedicineTime<6*60*60*1000){
        announce("Debe esperar para otra dosis");
        return;
    }

    lastMedicineTime=now;
    medicineGiven++;

    playSound("medicine_swallow.mp3");

    temperature-=0.5;
    comfort+=5;

    announce("Jarabe administrado");
}

// curación
setInterval(()=>{
    if(!babySick) return;

    let days=(Date.now()-sickStartTime)/(1000*60*60*24);

    if(medicineGiven>=3 && days>=2){
        babySick=false;
        medicineGiven=0;
        temperature=36.5;
        announce("El bebé se ha recuperado");
    }
},60000);

// ================= MÉDICO =================
function goDoctor(){

    if(activeSound) return;

    doctorState="waiting";

    playSound("outdoor.mp3");

    setTimeout(()=>{
        playSound("doctor_1.mp3");
    },3000);

    setTimeout(()=>{
        doctorState="ready";
        announce("Ya puedes entrar");
    },12000);
}

function enterDoctor(){

    if(doctorState!=="ready") return;
    if(activeSound) return;

    doctorState="inside";

    playSound("doctor_2.mp3");

    setTimeout(()=>{
        playSound("doctor_3.mp3");

        setTimeout(()=>{
            playSound("thermometer.mp3");

            setTimeout(()=>{
                announce("Temperatura "+temperature.toFixed(1)+" grados");
            },10000);

        },8000);

    },5000);

    setTimeout(()=>{
        playSound("doctor_4.mp3");
    },25000);
}

function exitDoctor(){

    if(doctorState!=="inside") return;

    doctorState="idle";

    if(activeSound) return;

    playSound("outdoor.mp3");
}

// ================= SONIDOS ALEATORIOS =================
let babySounds = [
    "babble.mp3","laugh.mp3","aaah_aaah.mp3",
    "tatata.mp3","dada.mp3",
    "popopo_ti_ta.mp3","mama_papa_tete.mp3"
];

function babyRandomSounds(){

    if(state!=="idle") return;

    let delay=15000+Math.random()*30000;

    setTimeout(()=>{

        if(!activeSound){

            // llantos prioridad
            if(hunger>85){
                playSound("cry_hunger.mp3"); return;
            }
            if(sleep>85){
                playSound("cry_sleep.mp3"); return;
            }
            if(comfort<15){
                playSound("cry_discomfort.mp3"); return;
            }

            if(babySick && Math.random()<0.3){
                playSound("babble_and_cry.mp3");
                return;
            }

            // conteo
            if(getAge()>2.8 && Math.random()<0.2){
                playSound("contar_1_10.mp3");
                return;
            }

            let sound;
            do{
                sound=babySounds[Math.floor(Math.random()*babySounds.length)];
            }while(sound===lastRandomSound);

            lastRandomSound=sound;

            playSound(sound);
        }

        babyRandomSounds();

    },delay);
}

babyRandomSounds();

</script>

</body>
</html>
