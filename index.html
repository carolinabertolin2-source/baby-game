<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<div id="startScreen">
    <input id="babyName" placeholder="Nombre">
    <button onclick="startGame()">Empezar</button>
</div>

<div id="game" style="display:none">

<!-- INTERACCIONES -->
<button onclick="playBaby()">Jugar</button>
<button onclick="hugBaby()">Abrazar</button>
<button onclick="rattle()">Sonajero</button>
<button onclick="pacifier()">Chupete</button>
<button onclick="walk()">Paseo</button>

<!-- COMIDA -->
<button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>

<button onclick="prepareFood()">Preparar papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<!-- BAÑO -->
<button onclick="bathWater()">Agua</button>
<button onclick="bathSoap()">Jabón</button>
<button onclick="bathRinse()">Aclarar</button>
<button onclick="bathDry()">Secar</button>

<!-- CUIDADO -->
<button onclick="soothe()">Arrullar</button>
<button onclick="sleepBaby()">Dormir</button>

<!-- MÉDICO -->
<button onclick="takeTemperature()">Tomar temperatura</button>
<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>
<button onclick="giveMedicine()">Jarabe</button>

<p id="status"></p>
<p id="age"></p>

</div>

<script>

// ================= VARIABLES =================
let startTime=Date.now();
let hunger=30, sleep=30, comfort=70;
let state="idle";
let activeSound=null;

// enfermedad
let babySick=false;
let temperature=36.5;
let medicineGiven=0;
let lastMedicineTime=0;
let sickStartTime=0;

// sonidos
let lastRandomSound=null;

// ================= EDAD =================
function getAge(){
    let elapsed = Date.now() - startTime;
    let total = 60*24*60*60*1000;
    return Math.min(3,(elapsed/total)*3);
}

// ================= AUDIO =================
function playSound(src){
    if(activeSound) return;
    let a=new Audio(src);
    activeSound=a;
    a.play();
    a.onended=()=>activeSound=null;
}

// ================= START =================
function startGame(){
    startTime=Date.now();
    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";
}

// ================= INTERACCIONES =================
function playBaby(){ playSound("laugh.mp3"); comfort+=5; }
function hugBaby(){ playSound("babble.mp3"); comfort+=10; }
function rattle(){ playSound("rattle.mp3"); }
function pacifier(){ playSound("pacifier.mp3"); }
function walk(){ playSound("outdoor.mp3"); }

// ================= COMIDA =================
function prepareBottle(){ playSound("bottle_prepare.mp3"); }

function feedBottle(){
    hunger-=30;
    playSound("bottle_drink.mp3");
}

function prepareFood(){
    if(getAge()<0.5){
        document.getElementById("status").innerText="Aún es pequeño para papilla";
        return;
    }
    playSound("food_prepare.mp3");
}

function feedFood(){
    if(getAge()<0.5){
        document.getElementById("status").innerText="Aún no puede comer papilla";
        return;
    }
    hunger-=25;
    playSound("food_eat.mp3");
}

// ================= BAÑO =================
function bathWater(){ playSound("bath_water.mp3"); }
function bathSoap(){ playSound("bath_soap.mp3"); }
function bathRinse(){ playSound("bath_water.mp3"); }
function bathDry(){ playSound("bath_dry.mp3"); }

// ================= SUEÑO =================
function soothe(){ playSound("musicbox.mp3"); }

function sleepBaby(){

    if(Math.random()<0.5){
        playSound("cry.mp3");
        return;
    }

    state="sleeping";

    let breathing=setInterval(()=>{
        if(!activeSound){
            playSound("breathing.mp3");
        }
    },8000);

    let sleepInterval=setInterval(()=>{
        sleep-=2;
        if(sleep<=10){
            clearInterval(sleepInterval);
            clearInterval(breathing);
            state="idle";
        }
    },2000);
}

// ================= ENFERMEDAD =================
setInterval(()=>{
    if(!babySick && Math.random()<0.01){
        babySick=true;
        sickStartTime=Date.now();
        document.getElementById("status").innerText="El bebé parece enfermo";
    }

    if(babySick && !activeSound && state==="idle"){
        if(Math.random()<0.4) playSound("cough.mp3");
        else if(Math.random()<0.4) playSound("sneeze.mp3");
    }
},15000);

// fiebre dinámica
setInterval(()=>{
    if(babySick){
        temperature += (Math.random()-0.5)*0.2;
        temperature=Math.max(37,Math.min(39,temperature));
        comfort-=0.2;
    }
},10000);

// ================= TERMÓMETRO =================
function takeTemperature(){
    playSound("thermometer.mp3");
    setTimeout(()=>{
        document.getElementById("status").innerText=
        "Temperatura "+temperature.toFixed(1)+" grados";
    },10000);
}

// ================= MEDICINA =================
function giveMedicine(){
    let now=Date.now();
    if(now-lastMedicineTime<6*60*60*1000){
        document.getElementById("status").innerText="Debe esperar";
        return;
    }

    lastMedicineTime=now;
    medicineGiven++;

    playSound("medicine_swallow.mp3");

    temperature-=0.5;
}

// curación
setInterval(()=>{
    if(!babySick) return;

    let days=(Date.now()-sickStartTime)/(1000*60*60*24);

    if(medicineGiven>=3 && days>=2){
        babySick=false;
        medicineGiven=0;
        temperature=36.5;
        document.getElementById("status").innerText="El bebé se ha recuperado";
    }
},60000);

// ================= MÉDICO =================
let doctorState="idle";

function goDoctor(){
    if(activeSound) return;
    doctorState="waiting";
    playSound("outdoor.mp3");

    setTimeout(()=>playSound("doctor_1.mp3"),3000);

    setTimeout(()=>{
        doctorState="ready";
        document.getElementById("status").innerText="Puedes entrar";
    },12000);
}

function enterDoctor(){
    if(doctorState!=="ready") return;
    if(activeSound) return;

    doctorState="inside";

    playSound("doctor_2.mp3");

    setTimeout(()=>{
        playSound("doctor_3.mp3");

        setTimeout(()=>{
            playSound("thermometer.mp3");

            setTimeout(()=>{
                document.getElementById("status").innerText=
                "Temperatura "+temperature.toFixed(1)+" grados";
            },10000);

        },8000);

    },5000);

    setTimeout(()=>playSound("doctor_4.mp3"),25000);
}

function exitDoctor(){
    if(doctorState!=="inside") return;
    doctorState="idle";
    playSound("outdoor.mp3");
}

// ================= SONIDOS ALEATORIOS =================
let sounds=[
"babble.mp3","laugh.mp3","aaah_aaah.mp3",
"tatata.mp3","dada.mp3",
"popopo_ti_ta.mp3","mama_papa_tete.mp3"
];

function babyRandomSounds(){

    if(state!=="idle") return;

    let delay=15000+Math.random()*30000;

    setTimeout(()=>{

        if(!activeSound){

            if(hunger>85){ playSound("cry_hunger.mp3"); return; }
            if(sleep>85){ playSound("cry_sleep.mp3"); return; }
            if(comfort<15){ playSound("cry_discomfort.mp3"); return; }

            let s;
            do{
                s=sounds[Math.floor(Math.random()*sounds.length)];
            }while(s===lastRandomSound);

            lastRandomSound=s;
            playSound(s);
        }

        babyRandomSounds();

    },delay);
}

babyRandomSounds();

</script>

</body>
</html>
