<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<div id="startScreen">
<input id="babyName" placeholder="Nombre del bebé">
<select id="babyGender">
<option>Niño</option>
<option>Niña</option>
</select>
<button onclick="startGame()">Empezar</button>
</div>

<div id="game" style="display:none">

<p id="age"></p>
<p id="status"></p>
<p id="needs"></p>

<button onclick="playBaby()">Jugar</button>
<button onclick="hugBaby()">Abrazar</button>
<button onclick="rattle()">Sonajero</button>
<button onclick="pacifier()">Chupete</button>
<button onclick="walk()">Paseo</button>

<button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>
<button onclick="prepareFood()">Preparar papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<!-- BAÑO EN 4 FASES -->
<button onclick="bathWater()">Agua</button>
<button onclick="bathSoap()">Jabón</button>
<button onclick="bathRinse()">Aclarar</button>
<button onclick="bathDry()">Secar</button>

<button onclick="diaperChange()">Cambiar pañal</button>
<button onclick="dressBaby()">Vestir</button>

<button onclick="soothe()">Arrullar</button>
<button onclick="sleepBaby()">Dormir</button>

<button onclick="takeTemperature()">Tomar temperatura</button>
<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>
<button onclick="giveMedicine()">Jarabe</button>

</div>

<script>

// ===== VARIABLES =====
let babyName="Bebé";
let startTime=Date.now();

let hunger=30, sleep=30, comfort=70, diaper=0;
let state="idle";
let activeSound=null;
let temperature=36.5;
let doctorReady=false;

// baño fases
let bathStep=0;

// ===== GUARDADO =====
function saveGame(){
localStorage.setItem("babyData", JSON.stringify({
babyName, startTime, hunger, sleep, diaper, comfort, lastTime:Date.now()
}));
}

function loadGame(){
let data = JSON.parse(localStorage.getItem("babyData"));
if(!data) return false;

babyName=data.babyName;
startTime=data.startTime;
hunger=data.hunger;
sleep=data.sleep;
diaper=data.diaper;
comfort=data.comfort;

let diff=(Date.now()-data.lastTime)/1000;
hunger+=diff*0.01;
sleep+=diff*0.01;
diaper+=diff*0.015;
comfort-=diff*0.005;

return true;
}

// ===== AUTO INICIO =====
window.onload=function(){

if(loadGame()){
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";

if(hunger>80||sleep>80||diaper>80){
setTimeout(()=>playSound("cry_hunger.mp3"),1000);
}
}

};

// ===== START =====
function startGame(){
babyName=document.getElementById("babyName").value||"Bebé";
startTime=Date.now();
saveGame();

document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
}

// ===== AUDIO =====
function playSound(src,callback){
if(activeSound) return;

let a=new Audio(src);
activeSound=a;
a.play().catch(()=>{});

a.onended=()=>{
activeSound=null;
if(callback) callback();
};
}

// ===== EDAD =====
function getAge(){
let elapsed=Date.now()-startTime;
let total=60*24*60*60*1000;
return Math.min(3,(elapsed/total)*3);
}

function getAgeText(){
let a=getAge();
let y=Math.floor(a);
let m=Math.floor((a-y)*12);

if(y===0) return m+" meses";
if(m===0) return y+" años";
return y+" años y "+m+" meses";
}

// ===== UI =====
setInterval(()=>{

document.getElementById("age").innerText="Edad: "+getAgeText();

// estado emocional
let mood="feliz";
if(comfort<40) mood="triste";
if(comfort<20) mood="muy incómodo";

document.getElementById("needs").innerText =
"Hambre: "+Math.floor(hunger)+
" | Sueño: "+Math.floor(sleep)+
" | Pañal: "+Math.floor(diaper)+
" | Estado: "+mood;

saveGame();

},2000);

// ===== NECESIDADES =====
setInterval(()=>{
hunger+=0.2;
sleep+=0.2;
diaper+=0.25;
comfort-=0.1;

if(diaper>80){
document.getElementById("status").innerText=babyName+" ha ensuciado el pañal";
}

},5000);

// ===== LLANTO =====
function randomCryLoop(){

if(state==="idle"&&!activeSound){

if(hunger>85) playSound("cry_hunger.mp3");
else if(sleep>85) playSound("cry_sleep.mp3");
else if(diaper>85) playSound("cry_discomfort.mp3");
else if(comfort<30) playSound("babble_and_cry.mp3");

}

setTimeout(randomCryLoop,8000+Math.random()*15000);
}
randomCryLoop();

// ===== BALBUCEO =====
function babbleLoop(){

if(state==="idle"&&!activeSound&&hunger<70&&sleep<70){

let age=getAge();
let sounds=["babble.mp3","aaah_aaah.mp3"];

if(age>0.3) sounds.push("tatata.mp3","popopo_ti_ta.mp3");
if(age>0.8) sounds.push("dada.mp3");
if(age>1.2) sounds.push("mama_papa_tete.mp3");
if(age>2.9) sounds.push("count_1_10.mp3");

playSound(sounds[Math.floor(Math.random()*sounds.length)]);
}

setTimeout(babbleLoop,15000+Math.random()*20000);
}
babbleLoop();

// ===== ACCIONES =====
function playBaby(){ comfort+=10; playSound("laugh.mp3"); }
function hugBaby(){ comfort+=15; playSound("babble.mp3"); }
function rattle(){ comfort+=5; playSound("rattle.mp3"); }
function pacifier(){ comfort+=5; playSound("pacifier.mp3"); }
function walk(){ comfort+=10; playSound("outdoor.mp3"); }

function prepareBottle(){ playSound("bottle_prepare.mp3"); }
function feedBottle(){ hunger-=30; playSound("bottle_drink.mp3"); }

function prepareFood(){
if(getAge()<0.5){
document.getElementById("status").innerText="Demasiado pequeño";
return;
}
playSound("food_prepare.mp3");
}
function feedFood(){ hunger-=25; playSound("food_eat.mp3"); }

// ===== BAÑO EN FASES =====
function bathWater(){
bathStep=1;
playSound("bath_water.mp3");
}

function bathSoap(){
if(bathStep!==1) return;
bathStep=2;
playSound("soap.mp3");
}

function bathRinse(){
if(bathStep!==2) return;
bathStep=3;
playSound("water.mp3");
}

function bathDry(){
if(bathStep!==3) return;
bathStep=0;
comfort+=20;
playSound("towel.mp3");
}

// ===== PAÑAL =====
function diaperChange(){
diaper=0;
comfort+=10;
playSound("diaper.mp3");
}

function dressBaby(){ comfort+=5; playSound("dress.mp3"); }
function soothe(){ comfort+=10; playSound("musicbox.mp3"); }

// ===== SUEÑO =====
function sleepBaby(){
state="sleeping";
playSound("breathing.mp3");
setTimeout(()=>{state="idle";sleep-=30;},20000);
}

// ===== TERMÓMETRO =====
function takeTemperature(){
playSound("thermometer.mp3",()=>{
setTimeout(()=>{
document.getElementById("status").innerText="Temperatura "+temperature.toFixed(1);
},4000);
});
}

// ===== MÉDICO =====
function goDoctor(){
playSound("outdoor.mp3",()=>{
setTimeout(()=>{
playSound("doctor_1.mp3",()=>{
setTimeout(()=>{
playSound("doctor_2.mp3");
doctorReady=true;
},7000);
});
},2000);
});
}

function enterDoctor(){
if(!doctorReady) return;

playSound("doctor_3.mp3",()=>{
setTimeout(()=>{
playSound("thermometer.mp3",()=>{
setTimeout(()=>{
document.getElementById("status").innerText="Temperatura "+temperature.toFixed(1);
setTimeout(()=>{
playSound("doctor_4.mp3");
},3000);
},4000);
});
},3000);
});
}

function exitDoctor(){
doctorReady=false;
playSound("outdoor.mp3");
}

// ===== JARABE =====
function giveMedicine(){
temperature-=0.5;
playSound("medicine_swallow.mp3");
}

</script>

</body>
</html>
