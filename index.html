<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head><body><h1>Simulador de Bebé</h1><button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>

<button onclick="prepareFood()">Preparar papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<button onclick="sleepBaby()">Dormir</button>
<button onclick="wakeUp()">Despertar</button>

<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>

<button onclick="takeTemperature()">Tomar fiebre</button>
<button onclick="giveMedicine()">Dar jarabe</button>

<p id="status"></p><script>

// ================== ESTADO ==================
let state = "idle";
let sick = false;
let temperature = 36.5;
let medicineToday = 0;
let lastMedicineDay = null;

let passiveSoundPlaying = false;
let activeSound = null;

// ================== UTIL ==================
function playSound(src, type="active") {
    if (state !== "idle" && type === "passive") return;
    if (activeSound) return;

    let audio = new Audio(src);
    activeSound = audio;

    audio.play();

    audio.onended = () => {
        activeSound = null;
        passiveSoundPlaying = false;
    };
}

// ================== BIBERÓN ==================
function prepareBottle() {
    state = "feeding";
    playSound("bottle_prepare.mp3");
}

function feedBottle() {
    state = "feeding";
    playSound("bottle_drink.mp3");
    setTimeout(()=> state="idle",3000);
}

// ================== PAPILLA ==================
function prepareFood() {
    playSound("food_prepare.mp3");
}

function feedFood() {
    state = "feeding";

    let spoon = new Audio("spoon_in_bowl.mp3");
    let eat = new Audio("food_eat.mp3");

    spoon.play();
    eat.play();

    setTimeout(()=> state="idle",4000);
}

// ================== SUEÑO ==================
function sleepBaby() {
    if (Math.random() < 0.5) {
        playSound("cry.mp3");
    } else {
        state = "sleep";
        playSound("sleep.mp3");
    }
}

function wakeUp() {
    state = "idle";
}

// ================== MÉDICO ==================
function goDoctor() {
    state = "doctor";
    playSound("outdoor.mp3");

    setTimeout(()=> playSound("doctor_1.mp3"),3000);
    setTimeout(()=> playSound("doctor_2.mp3"),20000);
}

function enterDoctor() {
    playSound("doctor_3.mp3");

    setTimeout(()=> {
        let t = generateTemp();
        new Audio("thermometer.mp3").play();
        setTimeout(()=> {
            alert("Temperatura: " + t + "°C");
        },10000);
    },5000);

    setTimeout(()=> playSound("doctor_4.mp3"),20000);
}

function exitDoctor() {
    playSound("outdoor.mp3");
    state = "idle";
}

// ================== TEMPERATURA ==================
function generateTemp() {
    if (sick) {
        temperature = (37.5 + Math.random()*2).toFixed(1);
    } else {
        temperature = (36 + Math.random()*1.2).toFixed(1);
    }
    return temperature;
}

function takeTemperature() {
    new Audio("thermometer.mp3").play();
    setTimeout(()=> {
        let t = generateTemp();
        alert("Temperatura: " + t + "°C");
    },4000);
}

// ================== JARABE ==================
function giveMedicine() {
    let today = new Date().toDateString();

    if (lastMedicineDay !== today) {
        medicineToday = 0;
        lastMedicineDay = today;
    }

    if (medicineToday >= 3) {
        alert("Ya ha tomado suficiente jarabe hoy");
        return;
    }

    medicineToday++;

    playSound("medicine_swallow.mp3");

    temperature -= 0.5;
}

// ================== SONIDOS PASIVOS ==================
setInterval(()=>{
    if(state === "idle" && !activeSound && !passiveSoundPlaying) {
        passiveSoundPlaying = true;

        if(Math.random()<0.5){
            playSound("babble.mp3","passive");
        } else {
            playSound("laugh.mp3","passive");
        }
    }
},15000);

// ================== ENFERMEDAD ==================
setInterval(()=>{
    if(sick && state==="idle" && !activeSound){
        if(Math.random()<0.5){
            playSound("cough.mp3","passive");
        } else {
            playSound("sneeze.mp3","passive");
        }
    }
},20000);

</script></body>
</html>
