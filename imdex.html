<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador de Bebé</title>
</head>

<body>

<h1>Simulador de Bebé</h1>

<!-- INICIO -->
<div id="startScreen">
    <h2>Crear bebé</h2>
    <input id="babyName" placeholder="Nombre del bebé">
    <select id="babyGender">
        <option value="boy">Niño</option>
        <option value="girl">Niña</option>
    </select>
    <button onclick="startGame()">Empezar</button>
</div>

<div id="game" style="display:none">

<!-- ACCIONES -->
<button onclick="playBaby()">Jugar</button>
<button onclick="hugBaby()">Abrazar</button>
<button onclick="rattle()">Sonajero</button>
<button onclick="pacifier()">Chupete</button>
<button onclick="walk()">Paseo</button>

<!-- ALIMENTACIÓN -->
<button onclick="prepareBottle()">Preparar biberón</button>
<button onclick="feedBottle()">Dar biberón</button>
<button onclick="prepareFood()">Preparar papilla</button>
<button onclick="feedFood()">Dar papilla</button>

<!-- BAÑO -->
<button onclick="bathWater()">Agua</button>
<button onclick="bathSoap()">Jabón</button>
<button onclick="bathRinse()">Aclarar</button>
<button onclick="bathDry()">Secar</button>

<!-- CUIDADOS -->
<button onclick="changeDiaper()">Pañal</button>
<button onclick="dress()">Vestir</button>

<!-- SUEÑO -->
<button onclick="soothe()">Arrullar</button>
<button onclick="sleepBaby()">Dormir</button>

<!-- MÉDICO -->
<button onclick="goDoctor()">Ir al médico</button>
<button onclick="enterDoctor()">Entrar</button>
<button onclick="exitDoctor()">Salir</button>

<!-- SALUD -->
<button onclick="takeTemperature()">Tomar fiebre</button>
<button onclick="giveMedicine()">Jarabe</button>

<!-- ACCESIBILIDAD -->
<button onclick="readStatus()">Consultar estado</button>

<p id="status"></p>
<p id="age"></p>

<p id="hunger" aria-live="polite"></p>
<p id="sleep" aria-live="polite"></p>
<p id="comfort" aria-live="polite"></p>

</div>

<script>

// ================= ESTADO =================
let state="idle";
let activeSound=null;

let babyName="";
let babyGender="";
let startTime=Date.now();

let sick=false;

// ================= NECESIDADES =================
let hunger=30;
let sleep=30;
let comfort=70;
let diaperDirty=false;

// ================= EMOCIONES =================
let mood="neutral";
let moodScore=50;

// ================= TALKBACK =================
let lastSpeakTime=0;
let lastEvent="";

function announceEvent(text,id){

    let now=Date.now();

    if(now-lastSpeakTime<20000) return;
    if(lastEvent===id) return;

    lastSpeakTime=now;
    lastEvent=id;

    document.getElementById("status").innerText=text;
}

function markAction(){
    lastSpeakTime=Date.now();
}

// ================= AUDIO =================
function playSound(src,force=false){

    if(!force && state!=="idle") return;
    if(activeSound) return;

    let audio=new Audio(src);
    activeSound=audio;

    audio.play();
    audio.onended=()=>activeSound=null;
}

// ================= CARGA PARTIDA =================
babyName=localStorage.getItem("babyName")||"";
babyGender=localStorage.getItem("babyGender")||"";
startTime=Number(localStorage.getItem("startTime"))||Date.now();

if(babyName){
    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";
    announceEvent("Has vuelto con "+babyName,"load");
}

// ================= INICIO =================
function startGame(){

    babyName=document.getElementById("babyName").value||"Bebé";
    babyGender=document.getElementById("babyGender").value;
    startTime=Date.now();

    localStorage.setItem("babyName",babyName);
    localStorage.setItem("babyGender",babyGender);
    localStorage.setItem("startTime",startTime);

    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";

    announceEvent(babyName+" ha nacido","start");
}

// ================= EDAD =================
function getAgeYears(){
    let days=(Date.now()-startTime)/86400000;
    return days/20;
}

setInterval(()=>{
    document.getElementById("age").innerText=
    "Edad: "+getAgeYears().toFixed(2)+" años";
},1000);

// ================= ESTADO VISIBLE =================
setInterval(()=>{

    hunger+=0.2;
    sleep+=0.15;
    comfort-=0.1;

    hunger=Math.min(100,hunger);
    sleep=Math.min(100,sleep);
    comfort=Math.max(0,comfort);

    document.getElementById("hunger").innerText="Hambre: "+hunger.toFixed(0);
    document.getElementById("sleep").innerText="Sueño: "+sleep.toFixed(0);
    document.getElementById("comfort").innerText="Confort: "+comfort.toFixed(0);

    if(hunger>80) announceEvent("El bebé tiene mucha hambre","hunger");
    if(sleep>80) announceEvent("El bebé tiene mucho sueño","sleep");
    if(comfort<30) announceEvent("El bebé está incómodo","comfort");

},3000);

// ================= LECTURA ESTADO =================
let lastStatusRead=0;

function readStatus(){

    let now=Date.now();
    if(now-lastStatusRead<15000) return;

    lastStatusRead=now;

    announceEvent(
    "Estado del bebé. Hambre "+hunger.toFixed(0)+
    ", sueño "+sleep.toFixed(0)+
    ", confort "+comfort.toFixed(0),
    "status"
    );
}

// ================= EMOCIONES =================
setInterval(()=>{

    moodScore -= hunger*0.01;
    moodScore -= (diaperDirty?1:0.2);

    if(moodScore>70) mood="happy";
    else if(moodScore<40) mood="sad";
    else mood="neutral";

},5000);

setInterval(()=>{
    if(mood==="sad") announceEvent("El bebé está triste","mood_sad");
    if(mood==="happy") announceEvent("El bebé está feliz","mood_happy");
},15000);

// ================= PAÑAL =================
setInterval(()=>{
    if(state!=="idle") return;

    if(Math.random()<0.01){
        diaperDirty=true;
        comfort-=15;
        announceEvent("El bebé ha ensuciado el pañal","diaper");
    }

},5000);

// ================= ACCIONES =================
function playBaby(){ markAction(); moodScore+=25; playSound("laugh.mp3",true); }
function hugBaby(){ markAction(); moodScore+=20; playSound("babble.mp3",true); }
function rattle(){ markAction(); playSound("rattle.mp3",true); }
function pacifier(){ markAction(); playSound("pacifier.mp3",true); }
function walk(){ markAction(); playSound("outdoor.mp3",true); }

function prepareBottle(){ markAction(); playSound("bottle_prepare.mp3",true); }
function feedBottle(){ markAction(); hunger-=30; playSound("bottle_drink.mp3",true); }

function prepareFood(){ playSound("food_prepare.mp3",true); }
function feedFood(){
    markAction();
    new Audio("spoon_in_bowl.mp3").play();
    new Audio("food_eat.mp3").play();
    hunger-=25;
}

function bathWater(){ playSound("bath_water.mp3",true); }
function bathSoap(){ playSound("bath_soap.mp3",true); }
function bathRinse(){ playSound("bath_water.mp3",true); }
function bathDry(){ playSound("bath_dry.mp3",true); }

function changeDiaper(){
    diaperDirty=false;
    comfort+=25;
    playSound("diaper.mp3",true);
    announceEvent("Pañal cambiado","clean");
}

function dress(){ playSound("clothes.mp3",true); }

function soothe(){ playSound("musicbox.mp3",true); }

function sleepBaby(){
    if(Math.random()<0.5){
        playSound("cry.mp3",true);
    }else{
        playSound("sleep.mp3",true);
    }
}

function goDoctor(){
    playSound("outdoor.mp3",true);
    setTimeout(()=>playSound("doctor_1.mp3",true),3000);
    setTimeout(()=>playSound("doctor_2.mp3",true),20000);
}

function enterDoctor(){
    playSound("doctor_3.mp3",true);

    setTimeout(()=>{
        new Audio("thermometer.mp3").play();
        setTimeout(()=>{
            let t=(36+Math.random()*2).toFixed(1);
            announceEvent(babyName+" tiene "+t+"°C","temp");
        },10000);
    },5000);

    setTimeout(()=>playSound("doctor_4.mp3",true),25000);
}

function exitDoctor(){ playSound("outdoor.mp3",true); }

function giveMedicine(){ playSound("medicine_swallow.mp3",true); }

// ================= SONIDOS PASIVOS (MUY RAROS) =================
setInterval(()=>{
    if(state!=="idle") return;
    if(activeSound) return;

    if(Math.random()<0.08){
        if(Math.random()<0.5){
            playSound("babble.mp3");
        }else{
            playSound("laugh.mp3");
        }
    }

},30000);

</script>

</body>
</html>
